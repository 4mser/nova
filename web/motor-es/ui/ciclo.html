<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>NOVA · ship ↔ Earth loop</title>
<link rel="stylesheet" href="ui.css?v=1794500000">
<style>
html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden}
@font-face{font-family:PM;src:url(../fonts/ibm-plex-mono-500-latin.woff2);font-weight:500}
svg.capa{position:absolute;inset:0;width:1920px;height:1080px;overflow:visible}
text{font-family:SG}
.m{font-family:PM;font-weight:500}
html.vert #tit{display:none}
</style></head><body>
<svg class="capa" id="lazo" viewBox="0 0 1920 1080"></svg>
<script src="../mascota-base.js"></script><script src="../mascota-orbes.js"></script><script src="ui.js?v=1794500000"></script>
<script>
/* El ciclo nave ↔ Tierra, en tres tiempos que siguen a la voz:
   A · la nave (núcleo F Prime) arma el informe en paquetes CCSDS y lo baja con el retraso de la luz;
   B · en la Tierra un modelo padre aprende de él, el cirujano de vuelo revisa y el padre destila un modelo hijo;
   C · el hijo sube firmado (ed25519), la nave verifica, instala y puede volver atrás; Control de Misión lo ve con retraso. */
const ES = /motor-es/.test(location.pathname);
const L = ES ? {
  tit: 'Aprende en la Tierra. Vuelve firmado.', sub: 'El ciclo de cada noche entre la nave y Control de Misión',
  nave: 'A BORDO · NOVA PC', fp: 'F Prime · software de vuelo del JPL',
  comps: [['MonitorSalud', 'salud de la tripulación'], ['Estacion', 'estación médica'], ['Pantalla', 'pantalla de la tripulación'], ['CdhCore', 'comandos y eventos'], ['ComCcsds', 'paquetes CCSDS'], ['FileHandling', 'archivos y versiones']],
  hijo: 'Modelo hijo', hijoS: 'corre a bordo, sin internet', tierra: 'EN LA TIERRA · CONTROL DE MISIÓN',
  padre: 'Modelo padre', padreS: 'grande, en servidores de la Tierra', ins: ['Informes', 'Ciencia abierta NASA', 'Misiones análogas'],
  rev: 'Revisado por cirujanos de vuelo', dest: 'el padre enseña al hijo', dest2: 'destilación', cabe: 'cabe en el computador de la nave',
  paq: 'Paquete CCSDS', cab: 'cabecera · 6 B', apid: 'APID salud', sec: 'secuencia', dat: 'informe de la noche · 6 KB', crc: 'control de errores',
  baja: 'informe ↓', sube: 'modelo hijo ↑', luz: 'min luz', firma: 'firma ed25519', ok: 'firma válida · instalado', atras: 'si algo falla, vuelve a', mc: 'Control de Misión ve la nave', mc2: 'con el retraso real de la luz',
  pila: [['F Prime', 'JPL · en uso', '#8fe6f5'], ['CCSDS', 'paquetes espaciales · en uso', '#46c8e8'], ['ed25519', 'actualizaciones firmadas · en uso', '#ec6aa8'], ['DTN · Bundle Protocol', 'red tolerante al retraso · siguiente', '#a898ff'], ['Deep Space Network', 'antenas de la NASA · siguiente', '#f2b457']]
} : {
  tit: 'Learns on Earth. Flies back signed.', sub: 'The nightly loop between the ship and Mission Control',
  nave: 'ON BOARD · NOVA PC', fp: 'F Prime · JPL flight software',
  comps: [['MonitorSalud', 'crew health'], ['Estacion', 'medical station'], ['Pantalla', 'crew display'], ['CdhCore', 'commands & events'], ['ComCcsds', 'CCSDS packets'], ['FileHandling', 'files & versions']],
  hijo: 'Child model', hijoS: 'runs on board, offline', tierra: 'ON EARTH · MISSION CONTROL',
  padre: 'Parent model', padreS: 'large, on Earth servers', ins: ['Nightly reports', 'NASA open science', 'Analog missions'],
  rev: 'Reviewed by flight surgeons', dest: 'the parent teaches the child', dest2: 'distillation', cabe: 'fits the ship computer',
  paq: 'CCSDS Space Packet', cab: 'header · 6 B', apid: 'APID health', sec: 'sequence', dat: 'nightly report · 6 KB', crc: 'error check',
  baja: 'report ↓', sube: 'child model ↑', luz: 'light-min', firma: 'ed25519 signature', ok: 'signature valid · installed', atras: 'if anything fails, back to', mc: 'Mission Control sees the ship', mc2: 'with the real delay of light',
  pila: [['F Prime', 'JPL · in use', '#8fe6f5'], ['CCSDS', 'space packets · in use', '#46c8e8'], ['ed25519', 'signed updates · in use', '#ec6aa8'], ['DTN · Bundle Protocol', 'delay-tolerant network · next', '#a898ff'], ['Deep Space Network', 'NASA antennas · next', '#f2b457']]
};
const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v)), pr = (t, a, d) => cl((t - a) / d);
const eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2, eOut = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const C = { cian: '#8fe6f5', ac: '#46c8e8', lila: '#a898ff', mag: '#ec6aa8', amb: '#f2b457', ok: '#6fd6b0', t1: '#f2f5f8', t2: '#9aa4b2', t3: '#5b6573', s1: '#0a0f15', s2: '#0f151d' };
const LUZ = 9.8;
const bz = (p0, p1, p2, u) => [(1 - u) ** 2 * p0[0] + 2 * (1 - u) * u * p1[0] + u * u * p2[0], (1 - u) ** 2 * p0[1] + 2 * (1 - u) * u * p1[1] + u * u * p2[1]];
const txt = (x, y, s, o = {}) => `<text x="${x}" y="${y}" font-size="${o.fs || 18}" font-weight="${o.fw || 400}" fill="${o.c || C.t1}" text-anchor="${o.a || 'start'}" opacity="${o.op ?? 1}"${o.m ? ' class="m" letter-spacing="2.4"' : ''}>${s}</text>`;
const caja = (x, y, w, h, o = {}) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.r || 26}" fill="${o.f || C.s1}" stroke="${o.s || 'rgba(255,255,255,.08)'}" stroke-width="${o.sw || 1.2}" opacity="${o.op ?? 1}"/>`;

// una red neuronal de puntos: el padre grande, el hijo chico
function red(cx, cy, capas, ancho, alto, col, k, t, semilla) {
  let h = ''; const pts = capas.map((n, i) => Array.from({ length: n }, (_, j) => [cx - ancho / 2 + ancho * i / (capas.length - 1), cy - alto / 2 + alto * (j + .5) / n]));
  for (let i = 0; i < pts.length - 1; i++) for (const a of pts[i]) for (const b of pts[i + 1]) {
    const f = .5 + .5 * Math.sin(t * 3 + a[1] * .05 + b[1] * .03 + i + semilla);
    h += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${col}" stroke-width=".8" opacity="${k * (.06 + .22 * f)}"/>`; }
  for (const c of pts) for (const p of c) h += `<circle cx="${p[0]}" cy="${p[1]}" r="${4.2}" fill="${col}" opacity="${k * .95}"/>`;
  return h;
}

function dibujarCiclo(t) {
  const vert = !!(parent.esVert && parent.esVert()); document.documentElement.classList.toggle('vert', vert);
  let h = '';
  const kIn = eOut(pr(t, 0, 1.2));
  // título
  h += `<g id="tit" opacity="${kIn}">${txt(150, 128, L.tit, { fs: 56, fw: 600 })}${txt(150, 172, L.sub, { fs: 21, c: C.t2 })}</g>`;

  /* ── A · la nave: núcleo F Prime ── */
  const NX = 130, NY = 230, NW = 500, NH = 640;
  h += `<g opacity="${kIn}" transform="translate(0 ${(1 - kIn) * 20})">${caja(NX, NY, NW, NH, { s: 'rgba(143,230,245,.28)' })}`;
  h += txt(NX + 32, NY + 50, L.nave, { fs: 14, c: C.cian, m: 1 });
  h += caja(NX + 24, NY + 76, NW - 48, 392, { f: C.s2, r: 20, s: 'rgba(143,230,245,.16)' });
  h += txt(NX + 48, NY + 112, L.fp, { fs: 19, fw: 600 });
  h += `<rect x="${NX + NW - 96}" y="${NY + 84}" width="56" height="52" rx="12" fill="#f2f5f8"/><image href="img/fprime-logo.svg" x="${NX + NW - 88}" y="${NY + 91}" width="40" height="38"/>`;
  L.comps.forEach(([n, d], i) => {
    const y = NY + 150 + i * 50, on = eOut(pr(t, 1.4 + i * .32, .5)), com = n === 'ComCcsds', pulso = com ? pr(t, 4.2, .5) * (1 - pr(t, 5.6, .6)) : 0;
    const col = com ? C.ac : (i === 0 ? C.ok : C.cian);
    h += `<rect x="${NX + 44}" y="${y - 22}" width="${NW - 88}" height="40" rx="12" fill="${col}" opacity="${.05 + .12 * on + .25 * pulso}"/>`;
    h += `<circle cx="${NX + 66}" cy="${y - 2}" r="5" fill="${col}" opacity="${.3 + .7 * on}"/>`;
    h += txt(NX + 84, y + 4, n, { fs: 17, fw: 600, op: .35 + .65 * on }) + txt(NX + NW - 60, y + 4, d, { fs: 15, c: C.t2, a: 'end', op: .35 + .65 * on });
  });
  // modelo hijo a bordo + versión (cambia al instalar)
  const inst = pr(t, 27.6, .7), ver = inst > .5 ? 'v1.5' : 'v1.4';
  h += caja(NX + 24, NY + 488, NW - 48, 128, { f: C.s2, r: 20, s: inst > 0 ? `rgba(111,214,176,${.2 + .5 * inst * (1 - pr(t, 29.5, 1))})` : 'rgba(168,152,255,.22)' });
  h += red(NX + 120, NY + 552, [3, 4, 3], 120, 74, C.lila, .9, t, 1);
  h += txt(NX + 210, NY + 538, L.hijo, { fs: 21, fw: 600 }) + txt(NX + 210, NY + 566, L.hijoS, { fs: 15, c: C.t2 });
  h += txt(NX + NW - 48, NY + 600, ver, { fs: 30, fw: 300, a: 'end', c: inst > .5 ? C.ok : C.t1 });
  h += '</g>';

  /* ── B · la Tierra: padre, revisión, destilación ── */
  const TX = 1290, TY = 230, TW = 500, TH = 640, kT = eOut(pr(t, .4, 1.2));
  h += `<g opacity="${kT}" transform="translate(0 ${(1 - kT) * 20})">${caja(TX, TY, TW, TH, { s: 'rgba(242,180,87,.3)' })}`;
  h += txt(TX + 32, TY + 50, L.tierra, { fs: 14, c: C.amb, m: 1 });
  const kP = eOut(pr(t, 10.4, 1.2)), entrena = pr(t, 11, 5);
  h += caja(TX + 24, TY + 76, TW - 48, 250, { f: C.s2, r: 20, s: `rgba(168,152,255,${.12 + .3 * kP})` });
  h += red(TX + 250, TY + 210, [5, 7, 7, 5], 300, 150, C.lila, .25 + .75 * kP, t * (1 + 2 * (entrena > 0 && entrena < 1)), 3);
  h += txt(TX + 48, TY + 112, L.padre, { fs: 21, fw: 600, op: .4 + .6 * kP }) + txt(TX + TW - 48, TY + 112, L.padreS, { fs: 14, c: C.t2, a: 'end', op: .4 + .6 * kP });
  // lo que entra al padre
  let xi = TX + 40; L.ins.forEach((s, i) => { const k = eOut(pr(t, 11 + i * .5, .6)), col = [C.cian, C.lila, C.amb][i], x = xi; xi += s.length * 7.1 + 40;
    h += `<g opacity="${k}"><rect x="${x}" y="${TY + 296}" width="144" height="0" fill="none"/><circle cx="${x + 8}" cy="${TY + 352}" r="5" fill="${col}"/>${txt(x + 20, TY + 357, s, { fs: 13.5, c: C.t2 })}</g>`; });
  // revisión del cirujano de vuelo
  const kR = eOut(pr(t, 15.2, .7));
  h += `<g opacity="${kR}"><rect x="${TX + 24}" y="${TY + 380}" width="${TW - 48}" height="52" rx="16" fill="${C.ok}" opacity=".12"/><path d="M${TX + 46} ${TY + 406} l8 8 l16 -18" fill="none" stroke="${C.ok}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${txt(TX + 84, TY + 413, L.rev, { fs: 18, fw: 500, c: C.ok })}</g>`;
  // destilación: el padre enseña al hijo
  const kD = eOut(pr(t, 16.6, 1.6)), kH = eOut(pr(t, 18, 1));
  h += `<g opacity="${kD}"><path d="M${TX + 250} ${TY + 440} L${TX + 250} ${TY + 500}" stroke="${C.lila}" stroke-width="2.4" stroke-dasharray="4 6"/><path d="M${TX + 242} ${TY + 494} l8 10 l8 -10" fill="none" stroke="${C.lila}" stroke-width="2.4"/>${txt(TX + 272, TY + 470, L.dest, { fs: 15, c: C.lila })}${txt(TX + 272, TY + 490, L.dest2, { fs: 12, c: C.t3, m: 1 })}</g>`;
  const sub = pr(t, 23.2, .5);
  h += `<g opacity="${kH * (1 - sub)}">${caja(TX + 24, TY + 512, TW - 48, 104, { f: C.s2, r: 20, s: 'rgba(168,152,255,.4)' })}${red(TX + 110, TY + 564, [3, 4, 3], 100, 60, C.lila, 1, t, 1)}${txt(TX + 190, TY + 556, L.hijo + ' v1.5', { fs: 20, fw: 600 })}${txt(TX + 190, TY + 582, L.cabe, { fs: 14.5, c: C.t2 })}</g>`;
  // Control de Misión con retraso
  const kM = eOut(pr(t, 28.4, .8));
  h += `<g opacity="${kM}"><circle cx="${TX + 48}" cy="${TY + 560}" r="6" fill="${C.amb}"/>${txt(TX + 66, TY + 556, L.mc, { fs: 19, fw: 600 })}${txt(TX + 66, TY + 582, `${L.mc2} · ${LUZ} ${L.luz}`, { fs: 15, c: C.amb })}</g>`;
  h += '</g>';

  /* ── el enlace: abajo el informe, arriba el hijo firmado ── */
  const A0 = [NX + NW, 420], B0 = [TX, 420], A1 = [TX, 700], B1 = [NX + NW, 700];
  const kL = eOut(pr(t, 1, 1));
  h += `<g opacity="${kL}"><path d="M${A0[0]} ${A0[1]} Q960 330 ${B0[0]} ${B0[1]}" fill="none" stroke="rgba(143,230,245,.22)" stroke-width="1.6" stroke-dasharray="3 8"/>`;
  h += `<path d="M${A1[0]} ${A1[1]} Q960 790 ${B1[0]} ${B1[1]}" fill="none" stroke="rgba(236,106,168,.22)" stroke-width="1.6" stroke-dasharray="3 8"/>`;
  h += txt(960, 336, L.baja, { fs: 14, c: C.cian, a: 'middle', m: 1 }) + txt(960, 800, L.sube, { fs: 14, c: C.mag, a: 'middle', m: 1 }) + '</g>';
  // antena y retraso de la luz al centro
  const an = 960, ay = 560;
  h += `<g opacity="${kL}"><path d="M${an - 40} ${ay - 8} A46 46 0 0 0 ${an + 40} ${ay - 8} Z" fill="none" stroke="#c5cfdb" stroke-width="2"/><line x1="${an}" y1="${ay - 8}" x2="${an}" y2="${ay - 40}" stroke="#c5cfdb" stroke-width="2"/><circle cx="${an}" cy="${ay - 42}" r="4" fill="${C.cian}"/><line x1="${an}" y1="${ay + 14}" x2="${an}" y2="${ay + 40}" stroke="#c5cfdb" stroke-width="2"/><line x1="${an - 22}" y1="${ay + 40}" x2="${an + 22}" y2="${ay + 40}" stroke="#c5cfdb" stroke-width="2"/>`;
  for (let k = 0; k < 3; k++) { const u = (t * .55 + k / 3) % 1; h += `<circle cx="${an}" cy="${ay - 42}" r="${6 + u * 46}" fill="none" stroke="${C.cian}" opacity="${.38 * (1 - u)}"/>`; }
  h += txt(an, ay + 76, `${LUZ} ${L.luz}`, { fs: 26, fw: 300, a: 'middle' }) + '</g>';

  // A · el paquete CCSDS: se arma en ComCcsds y baja a la Tierra
  const kA = eOut(pr(t, 4.4, .8)) * (1 - pr(t, 9.6, .6));
  if (kA > 0) { const x0 = 720, y0 = 186, w = 480;
    h += `<g opacity="${kA}" transform="translate(0 ${(1 - kA) * 14})">${caja(x0, y0, w, 112, { f: '#08131a', r: 16, s: 'rgba(70,200,232,.55)' })}${txt(x0 + 20, y0 + 30, L.paq, { fs: 14, c: C.ac, m: 1 })}`;
    const seg = [[L.cab, 96, C.cian], [L.apid, 84, C.ac], [L.sec, 72, C.ac], [L.dat, 156, C.ok], [L.crc, 72, C.lila]]; let x = x0 + 20;
    seg.forEach(([s, ww, col], i) => { const k = eOut(pr(t, 4.8 + i * .25, .4)); h += `<rect x="${x}" y="${y0 + 46}" width="${ww - 4}" height="26" rx="6" fill="${col}" opacity="${.18 + .5 * k}"/>${txt(x + (ww - 4) / 2, y0 + 94, s, { fs: 11.5, c: C.t2, a: 'middle', op: k })}`; x += ww; });
    h += '</g>'; }
  const kv = pr(t, 5.6, 3.8);
  if (kv > 0 && kv < 1) { const u = eIO(kv), [x, y] = bz(A0, [960, 330], B0, u), op = Math.min(1, kv * 6, (1 - kv) * 6);
    for (let j = 0; j < 5; j++) { const [a, b] = bz(A0, [960, 330], B0, Math.max(0, u - j * .014)); h += `<circle cx="${a}" cy="${b}" r="${6 - j}" fill="${C.cian}" opacity="${op * (1 - j / 5)}"/>`; }
    h += txt(x, y - 22, `T+ ${(u * LUZ).toFixed(1)} min`, { fs: 14, c: C.cian, a: 'middle', m: 1, op }); }
  // C · el hijo firmado sube a la nave
  const kF = eOut(pr(t, 22.2, .7));
  if (kF > 0 && t < 27.4) { const ku = pr(t, 23.2, 4), u = eIO(ku), [x, y] = ku > 0 ? bz(A1, [960, 790], B1, u) : [TX + 250, TY + 564], op = Math.min(1, kF, ku > 0 ? (1 - ku) * 6 : 1);
    h += `<g opacity="${op}" transform="translate(${x} ${y})"><rect x="-128" y="-30" width="256" height="60" rx="16" fill="#140d16" stroke="rgba(236,106,168,.7)"/>${red(-80, 0, [3, 4, 3], 64, 34, C.lila, 1, t, 1)}${txt(-36, -4, L.hijo + ' v1.5', { fs: 15, fw: 600 })}${txt(-36, 17, L.firma, { fs: 12.5, c: C.mag })}`;
    h += `<g transform="translate(118 -26)"><circle r="17" fill="${C.mag}" opacity=".9"/><path d="M-6 0 l4 4 l8 -9" fill="none" stroke="#140d16" stroke-width="2.6" stroke-linecap="round"/></g></g>`;
    if (ku > 0) h += txt(x, y + 52, `T+ ${(u * LUZ).toFixed(1)} min`, { fs: 14, c: C.mag, a: 'middle', m: 1, op }); }
  // la nave verifica y puede volver atrás
  const kV = eOut(pr(t, 27.3, .6));
  if (kV > 0) { const vx = NX + NW + 40, vy = 836;
    h += `<g opacity="${kV}"><rect x="${vx}" y="${vy}" width="380" height="50" rx="16" fill="${C.ok}" opacity=".14"/><path d="M${vx + 22} ${vy + 25} l7 7 l14 -16" fill="none" stroke="${C.ok}" stroke-width="3" stroke-linecap="round"/>${txt(vx + 54, vy + 31, L.ok, { fs: 17, fw: 500, c: C.ok })}</g>`;
    const kB = eOut(pr(t, 28.2, .6)); h += `<g opacity="${kB}">${txt(vx + 22, vy + 84, `↺ ${L.atras} v1.4`, { fs: 15.5, c: C.t2 })}</g>`; }
  /* ── la pila de comunicación ── */
  const kS = eOut(pr(t, 2.2, 1));
  let x = 150; const yS = 1000;
  L.pila.forEach(([n, d, col], i) => { const k = eOut(pr(t, 2.2 + i * .2, .6)), w = 14 + Math.max(n.length * 10.5, d.length * 7.6) + 30;
    h += `<g opacity="${kS * k}"><rect x="${x}" y="${yS - 34}" width="${w}" height="58" rx="16" fill="${C.s1}" stroke="${col}" stroke-opacity=".45"/><circle cx="${x + 18}" cy="${yS - 14}" r="5" fill="${col}"/>${txt(x + 32, yS - 9, n, { fs: 16, fw: 600 })}${txt(x + 18, yS + 13, d, { fs: 12.5, c: C.t2 })}</g>`;
    x += w + 14; });
  $('lazo').innerHTML = h;
}
window.dibujarCiclo = dibujarCiclo;
dibujarCiclo(+(location.hash.slice(1) || 0));
</script>
</body></html>
