# API de NOVA (cuentas, crew, fotos, tareas). SQLite y fotos en el volumen /data: UNA sola máquina.
# Siempre encendida (~US$2/mes): manda los avisos programados (resumen del standup, retos, tareas que vencen) y la
# app no espera el arranque en frío.
app = "nova-bn-api"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "nova_datos"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "60s"
  method = "GET"
  path = "/v1/salud"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
