# Puente de voz de NOVA (WebSocket ⇄ Gemini Live). Se apaga solo sin uso y despierta con la primera conexión.
app = "nova-voz"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
