<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05080c">
<title>NOVA · Twin camera</title>
<!-- An extra camera for the body twin's mirror. The phone finds the body with MediaPipe Pose on the phone itself and sends
     only the 33 body points (in meters) to the ship; the picture never leaves the phone. Put it anywhere around you:
     the ship works out where each camera is by lining up the skeletons and fuses all views into one body. -->
<style>
@font-face{font-family:SG;src:url(fuentes/space-grotesk-500-latin.woff2);font-weight:500}
@font-face{font-family:SG;src:url(fuentes/space-grotesk-600-latin.woff2);font-weight:600}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#05080c;color:#f2f5f8;font-family:SG,system-ui,sans-serif}
video,canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
canvas{pointer-events:none}
.barra{position:fixed;left:12px;right:12px;bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;justify-content:space-between;
  padding:10px 12px;border-radius:18px;background:rgba(5,8,12,.78);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.estado{font:500 13px SG;color:#9aa4b2;line-height:1.35}
.estado b{display:block;font-weight:600;color:#8fe6f5;font-size:14px}
button{font:600 14px SG;color:#05080c;background:#8fe6f5;border:0;border-radius:14px;height:40px;padding:0 14px;cursor:pointer}
button.sec{background:transparent;color:#f2f5f8;border:1px solid rgba(255,255,255,.2)}
.inicio{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.inicio p{color:#9aa4b2;max-width:320px;line-height:1.45}
[hidden]{display:none!important}
</style>
</head>
<body>
<video id="v" playsinline muted></video>
<canvas id="c"></canvas>
<div class="inicio" id="inicio">
  <b style="font-size:20px">Twin camera</b>
  <p>Point this phone at the person. The body twin on the ship will copy their posture using this view too. Only body points are sent, never the picture.</p>
  <button id="empezar">Start camera</button>
</div>
<div class="barra" id="barra" hidden>
  <div class="estado" id="estado"><b>Starting…</b></div>
  <div style="display:flex;gap:6px"><button class="sec" id="voltear">Flip</button><button class="sec" id="parar">Stop</button></div>
</div>
<script type="module" src="camara.js"></script>
</body>
</html>
